trunk:
  key-name: "Multiversal Key"
  key-lore: "<gray>Craft it with an ender chest and a chest</gray>\n<gray>to make a multiversal trunk.</gray>"
  trunk-name: "Multiversal Trunk"
  trunk-lore: "<gray>Opens your own 54-slot storage.</gray>\n<gray>Every trunk in linked worlds opens the same one.</gray>\n<gray>Breaking it never drops what's inside.</gray>"
  title: "Multiversal Trunk · <scope>"
  linked: "<light_purple>Linked to: <scope></light_purple>"
  shut: "<yellow>This trunk won't open here right now. Your items are safe, and an admin can see why.</yellow>"
  unreadable: "<yellow>Your trunk here can't be opened right now, to keep your items safe. An admin has been told.</yellow>"
  wrong-mode: "<gray>Trunks don't open in this game mode.</gray>"
  no-permission: "<gray>You can't open trunks.</gray>"
