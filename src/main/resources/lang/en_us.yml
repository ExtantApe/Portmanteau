# Portmanteau's player messages, in MiniMessage. Copy this file as lang/<locale>.yml (such as de_de.yml) to
# translate it; players get their own language's file when there is one. Meaning is always in the words, not only
# the colour.

sort:
  done: "<green>Sorted <count> items.</green>"
  already: "<gray>Already sorted.</gray>"
  left-safe: "<yellow>We left this as it was, to keep your items safe.</yellow>"
  failed: "<red>Something went wrong, so we stopped. Please tell an admin; they have the details.</red>"
  not-here: "<gray>That can't be sorted here.</gray>"
  first-hint: "<gray>Your chest was sorted for you. Type <click:run_command:'/sort'><hover:show_text:'Open the sorting setup'><u>/sort</u></hover></click> to choose how.</gray>"

quick-transfer:
  in: "<green>Moved <count> items into the container.</green>"
  out: "<green>Took <count> items out.</green>"

