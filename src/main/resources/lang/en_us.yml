  fine-tune-chests: "Fine-tune chests"
  fine-tune-inventory: "Fine-tune inventory"
  fine-tune-hotbar: "Fine-tune hotbar"
  fine-tune-tip: "Pick which kinds of items come first"
  fine-tune-title: "What comes first"
